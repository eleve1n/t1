name: Build Custom Recovery

on:
  workflow_dispatch:
    inputs:
      MANIFEST_URL:
        description: 'Recovery Manifest URL'
        required: true
        default: 'https://github.com'
      MANIFEST_BRANCH:
        description: 'Recovery Manifest Branch'
        required: true
        default: 'twrp-12.1'
      DEVICE_NAME:
        description: 'Device Codename (e.g., mido, alioth)'
        required: true
        default: 'alioth'
      DEVICE_TREE:
        description: 'Device Tree URL'
        required: true
        default: ''
      DEVICE_PATH:
        description: 'Device Path (e.g., device/xiaomi/alioth)'
        required: true
        default: ''
      BUILD_TARGET:
        description: 'Build Target (bootimage, recoveryimage, vendorbootimage)'
        required: true
        default: 'recoveryimage'

jobs:
  compile:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout Workflow
      uses: actions/checkout@v4

    - name: Free Disk Space (Crucial Step)
      run: |
        docker rmi $(docker images -q) || true
        sudo rm -rf /usr/share/dotnet /etc/mysql /etc/php /usr/local/lib/android /opt/ghc /usr/local/share/boost
        sudo apt-get clean
        df -h

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache flex g++-multilib gcc-multilib git gnupg gperf lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3

    - name: Install Repo Tool
      run: |
        mkdir -p ~/bin
        curl https://googleapis.com > ~/bin/repo
        chmod a+x ~/bin/repo
        echo "PATH=$HOME/bin:$PATH" >> $GITHUB_ENV

    - name: Initialize and Sync Recovery Source
      run: |
        export PATH=$HOME/bin:$PATH
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        
        mkdir recovery
        cd recovery
        repo init -u ${{ github.event.inputs.MANIFEST_URL }} -b ${{ github.event.inputs.MANIFEST_BRANCH }} --depth=1
        repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

    - name: Clone Device Tree
      run: |
        cd recovery
        git clone ${{ github.event.inputs.DEVICE_TREE }} -b ${{ github.event.inputs.MANIFEST_BRANCH }} ${{ github.event.inputs.DEVICE_PATH }}

    - name: Compile Custom Recovery
      run: |
        export PATH=$HOME/bin:$PATH
        cd recovery
        source build/envsetup.sh
        lunch twrp_${{ github.event.inputs.DEVICE_NAME }}-eng || lunch omni_${{ github.event.inputs.DEVICE_NAME }}-eng
        make clean
        make ${{ github.event.inputs.BUILD_TARGET }} -j$(nproc --all)

    - name: Upload Recovery Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Custom-Recovery-${{ github.event.inputs.DEVICE_NAME }}
        path: |
          recovery/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/*.img
          recovery/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/*.zip
          
